services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quishguard-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - quishguard-network
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quishguard-frontend
    ports:
      - "3000:80"
    networks:
      - quishguard-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  quishguard-network:
    driver: bridge
